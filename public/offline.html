<!doctype html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#064e3b">
    <title>ورد — دون اتصال</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f6f2;color:#1c1917;font-family:system-ui,sans-serif;padding:1.5rem}
      main{width:min(100%,32rem);text-align:center;background:#fff;border:1px solid #e7e5e4;border-radius:1.5rem;padding:2rem;box-shadow:0 12px 36px #1c19170d}
      .mark{display:grid;place-items:center;width:4rem;height:4rem;margin:auto;border-radius:1.25rem;background:#064e3b;color:#fff;font-size:1.5rem;font-weight:800}
      h1{font-size:1.6rem;margin:1.25rem 0 .75rem}p{color:#57534e;line-height:1.8}button{min-height:3rem;border:0;border-radius:1rem;background:#064e3b;color:#fff;font:inherit;font-weight:700;padding:.75rem 1.5rem;cursor:pointer}
      button:focus-visible{outline:3px solid #d9a441;outline-offset:3px}
      [hidden]{display:none!important}#offline-reader{width:100%}.reader-shell{width:min(100%,56rem);background:transparent;border:0;box-shadow:none;padding:0;text-align:initial}.reader-header,.quran-page,.reader-navigation,.completion-card,.offline-card{background:#fff;border:1px solid #e7e5e4;border-radius:1.5rem;padding:1.25rem;box-shadow:0 8px 24px #1c19170a}.reader-header h1{font-size:1.15rem;margin:.9rem 0}.offline-badge,.queued-status{color:#065f46;font-weight:700}.pages{display:grid;gap:1rem;margin:1rem 0}.quran-page h2{text-align:center;color:#065f46;font-size:.95rem;border-bottom:1px solid #e7e5e4;padding-bottom:.9rem}.verse-group+.verse-group{margin-top:2rem}.verse-group h3{background:#f7f0dd;border-radius:1rem;padding:.7rem;text-align:center}.quran-text{font-family:'Traditional Arabic','Amiri',serif;font-size:1.75rem;line-height:2.55;text-align:center;color:#1c1917}.verse-number{color:#065f46;font-size:.72em;white-space:nowrap}.reader-navigation{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.secondary-action{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;border:1px solid #d6d3d1;border-radius:1rem;background:#fff;color:#1c1917;text-decoration:none;font-weight:700;padding:.75rem}.completion-card{margin-top:1rem}.completion-card h2{margin-top:0}.reader-navigation button:disabled,.completion-card button:disabled{opacity:.55;cursor:not-allowed}.offline-card{margin:auto}
      .downloaded-list{display:grid;gap:.75rem;margin-top:1rem}
    </style>
  </head>
  <body>
    <main id="offline-fallback">
      <div class="mark" aria-hidden="true">و</div>
      <p>ورد</p>
      <h1>أنتِ غير متصلة بالإنترنت</h1>
      <p>يمكنكِ العودة إلى التطبيق عند استعادة الاتصال.</p>
      <button id="offline-retry" type="button">إعادة المحاولة</button>
    </main>
    <div id="offline-reader" hidden aria-live="polite">
      <p id="offline-reader-message">جارٍ فتح الجلسة المحفوظة…</p>
    </div>
    <script src="/offline-reader.js" defer></script>
  </body>
</html>
