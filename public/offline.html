<!doctype html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#064e3b">
    <title>ورد — دون اتصال</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f6f2;color:#1c1917;font-family:system-ui,sans-serif;padding:1.5rem}
      main{width:min(100%,32rem);text-align:center;background:#fff;border:1px solid #e7e5e4;border-radius:1.5rem;padding:2rem;box-shadow:0 12px 36px #1c19170d}
      .mark{display:grid;place-items:center;width:4rem;height:4rem;margin:auto;border-radius:1.25rem;background:#064e3b;color:#fff;font-size:1.5rem;font-weight:800}
      h1{font-size:1.6rem;margin:1.25rem 0 .75rem}p{color:#57534e;line-height:1.8}button{min-height:3rem;border:0;border-radius:1rem;background:#064e3b;color:#fff;font:inherit;font-weight:700;padding:.75rem 1.5rem;cursor:pointer}
      button:focus-visible{outline:3px solid #d9a441;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">و</div>
      <p>ورد</p>
      <h1>أنتِ غير متصلة بالإنترنت</h1>
      <p>يمكنكِ العودة إلى التطبيق عند استعادة الاتصال.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
